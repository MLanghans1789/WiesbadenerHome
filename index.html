6)%7+state.weekOffset*7);return d}function dayName(d){return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}function go(t){tab=t;render()}function render(){document.getElementById('nav').innerHTML=['Übersicht','Rezepte','Wochenplan','Einkaufsliste','Kalender','To-dos','Packlisten','Schule & Freizeit','Daten'].map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');document.getElementById('main').innerHTML=({Übersicht:overview,Rezepte:recipes,Wochenplan:planner,Einkaufsliste:shopping,Kalender:calendar,'To-dos':todos,Packlisten:packing, 'Schule & Freizeit':school,Daten:data})[tab]();if(tab==='Übersicht')loadWeather()}const WEATHER_CITIES={Berlin:[52.52,13.405]};

async function loadWeather(force=false){let city='Berlin',el=document.getElementById('weatherResult');if(!el)return;let old=weatherCache[city];if(old&&!force&&Date.now()-old.fetched<1800000){el.innerHTML=weatherText(old);return}el.textContent='Wetterdaten werden geladen …';try{let url='https://api.open-meteo.com/v1/dwd-icon?latitude=52.52&longitude=13.405&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=1';let res=await fetch(url);if(!res.ok)throw Error('HTTP '+res.status);let json=await res.json(),temp=json.daily?.temperature_2m_max?.[0],min=json.daily?.temperature_2m_min?.[0],rain=json.daily?.precipitation_probability_max?.[0];if(![temp,min,rain].every(Number.isFinite))throw Error('Unvollständige Wetterdaten');weatherCache[city]={temp,min,rain,fetched:Date.now()};if(tab==='Übersicht'){let target=document.getElementById('weatherResult');if(target)target.innerHTML=weatherText(weatherCache[city])}}catch(e){console.warn('DWD-ICON Wetterabruf fehlgeschlagen:',e);if(tab==='Übersicht'){let target=document.getElementById('weatherResult');if(target)target.textContent='DWD-Wetterdaten derzeit nicht verfügbar. Bitte später erneut versuchen.'}}}

let recipeLabelFilter='',taskLabelFilter='all';

function recipeLabelBadge(id){let l=state.recipeLabels.find(x=>x.id===id);return l?`<span class="tag" style="background:${l.color}22;color:${l.color};border:1px solid ${l.color}66">${esc(l.name)}</span>`:''}
function addRecipeLabel(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;state.recipeLabels.push({id:uid(),name,color:f.get('color')});save();render()}
function editRecipeLabel(id,key,value){let l=state.recipeLabels.find(x=>x.id===id);if(!l||key==='name'&&!value.trim())return;l[key]=value;save();render()}
function deleteRecipeLabel(id){if(!confirm('Rezept-Label löschen?'))return;state.recipeLabels=state.recipeLabels.filter(l=>l.id!==id);state.recipes.forEach(r=>r.labelIds=(r.labelIds||[]).filter(x=>x!==id));if(recipeLabelFilter===id)recipeLabelFilter='';save();render()}
function toggleRecipeLabel(recipeId,labelId,checked){let r=state.recipes.find(x=>x.id===recipeId);if(!r)return;r.labelIds ||= [];r.labelIds=r.labelIds.filter(x=>x!==labelId);if(checked)r.labelIds.push(labelId);save();render()}
function recipeLabelPanel(){return `<div class="panel"><h3>Rezept-Labels verwalten</h3><form class="row" onsubmit="addRecipeLabel(event)"><input name="name" required maxlength="40" placeholder="z. B. Suppe, Salat"><input type="color" name="color" value="#64b6a1" aria-label="Farbe"><button>+ Label</button></form>${state.recipeLabels.map(l=>`<div class="label-card">${recipeLabelBadge(l.id)}<input aria-label="Labelname" value="${esc(l.name)}" onchange="editRecipeLabel('${l.id}','name',this.value)"><input type="color" value="${l.color}" onchange="editRecipeLabel('${l.id}','color',this.value)"><button class="danger" onclick="deleteRecipeLabel('${l.id}')">Löschen</button></div>`).join('')}</div>`}
function recipes(){return `<div class="panel"><div class="row"><h2>Meine Rezepte</h2><input id="recipeSearch" placeholder="Rezept suchen …" oninput="filterRecipes()"><select id="recipeLabelFilter" aria-label="Nach Rezept-Label filtern" onchange="recipeLabelFilter=this.value;filterRecipes()"><option value="">Alle Labels</option><option value="_none">Ohne Label</option>${state.recipeLabels.map(l=>`<option value="${l.id}" ${recipeLabelFilter===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select><button class="primary" onclick="document.getElementById('addRecipe').classList.toggle('hidden')">+ Rezept</button></div><div id="addRecipe" class="hidden"><h3>Neues Rezept</h3><form onsubmit="addRecipe(event)"><input name="name" required placeholder="Name"><input name="portions" type="number" min="1" value="4" required placeholder="Portionen"><input name="minutes" type="number" min="0" value="20" placeholder="Minuten"><input name="category" placeholder="Kategorie"><p class="muted">Zutaten: eine pro Zeile, Format: Menge | Einheit | Zutat (z. B. 200 | g | Tomaten)</p><textarea name="ingredients" required></textarea><p class="muted">Zubereitung: ein Schritt pro Zeile</p><textarea name="steps"></textarea><input name="url" type="url" placeholder="Quell-URL (optional)"><button class="primary">Speichern</button></form></div>${recipeLabelPanel()}<div id="recipeList">${state.recipes.map(r=>`<div class="item recipeItem" data-search="${esc((r.name+' '+r.category).toLowerCase())}" data-labels="${esc((r.labelIds||[]).join(','))}"><div class="row"><strong>${esc(r.name)}</strong><span class="pill">${esc(r.source||'Mein Rezept')}</span>${(r.labelIds||[]).map(recipeLabelBadge).join('')}<span class="muted">${r.portions} Portionen · ${r.minutes} Min.</span></div><details><summary>Zutaten, Zubereitung und Labels</summary><h4>Labels zuweisen</h4><div class="row">${state.recipeLabels.map(l=>`<label>${`<input type="checkbox" ${(r.labelIds||[]).includes(l.id)?'checked':''} onchange="toggleRecipeLabel('${r.id}','${l.id}',this.checked)">`}${recipeLabelBadge(l.id)}</label>`).join('')||'<span class="muted">Lege oben zuerst ein Label an.</span>'}</div><h4>Zutaten</h4><ul>${r.ingredients.map(i=>`<li>${esc(i[0])} ${esc(i[1])} ${esc(i[2])}</li>`).join('')}</ul><h4>Zubereitung</h4><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">Quelle öffnen</a>`:''}<p><button class="danger" onclick="removeRecipe('${r.id}')">Rezept löschen</button></p></details></div>`).join('')}</div></div>`}function filterRecipes(){let q=document.getElementById('recipeSearch').value.toLowerCase();document.querySelectorAll('.recipeItem').forEach(e=>e.classList.toggle('hidden',!e.dataset.search.includes(q)||(recipeLabelFilter==='_none'?!!e.dataset.labels:!!recipeLabelFilter&&!e.dataset.labels.split(',').includes(recipeLabelFilter))))}function addRecipe(e){e.preventDefault();let f=new FormData(e.target);let ingredients=String(f.get('ingredients')).split('\n').filter(Boolean).map(s=>s.split('|').map(x=>x.trim())).filter(a=>a.length===3&&Number.isFinite(Number(a[0].replace(',','.'))));if(!ingredients.length)return alert('Bitte Zutaten im Format Menge | Einheit | Zutat eingeben.');state.recipes.push({id:uid(),name:f.get('name'),portions:+f.get('portions'),minutes:+f.get('minutes'),category:f.get('category'),source:'Mein Rezept',ingredients,steps:String(f.get('steps')).split('\n').filter(Boolean),url:f.get('url'),labelIds:[]});save();render()}function removeRecipe(id){if(confirm('Rezept wirklich löschen?')){state.recipes=state.recipes.filter(r=>r.id!==id);state.plan=state.plan.filter(p=>p.recipeId!==id);save();render()}}
function planner(){let start=weekStart();return `<div class="panel"><div class="row"><h2>Wochenplan</h2><button onclick="changeWeek(-1)">← Vorwoche</button><strong>${dayName(start)} – ${dayName(addDays(start,6))}</strong><button onclick="changeWeek(1)">Folgewoche →</button><button onclick="changeWeek(0)">Heute</button></div><div class="days">${Array.from({length:7},(_,i)=>{let d=addDays(start,i),date=localDate(d);return `<div class="day"><strong>${dayName(d)}</strong>${state.plan.filter(p=>p.date===date).map(p=>{let r=state.recipes.find(r=>r.id===p.recipeId);return r?`<div class="item">${esc(r.name)}<br><span class="muted">${p.portions} Portionen × ${p.count||1} Zubereitung(en)</span><br><button onclick="removePlan('${p.id}')">× Entfernen</button></div>`:''}).join('')}<select id="r${i}"><option value="">Rezept wählen</option>${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><input id="p${i}" type="number" min="1" value="2" style="width:100%;margin:6px 0" aria-label="Portionen"><label style="font-size:12px">Anzahl Zubereitungen <input id="c${i}" type="number" min="1" max="100" value="1" style="width:100%"></label><button onclick="addPlan('${date}',${i})">+ Hinzufügen</button></div>`}).join('')}</div></div>`}function changeWeek(n){state.weekOffset=n===0?0:state.weekOffset+n;save();render()}function addPlan(date,i){let recipeId=document.getElementById('r'+i).value,portions=+document.getElementById('p'+i).value,count=+document.getElementById('c'+i).value;if(!recipeId||!Number.isFinite(portions)||portions<=0||!Number.isInteger(count)||count<1||count>100)return;state.plan.push({id:uid(),date,recipeId,portions,count});save();render()}function removePlan(id){state.plan=state.plan.filter(p=>p.id!==id);save();render()}
function norm(s){return String(s).toLocaleLowerCase('de-DE').normalize('NFKC').replace(/\s+/g,' ').trim()}function quantity(x){return Number(String(x).replace(',','.'))}function fmt(n){return Number(n.toFixed(3)).toLocaleString('de-DE',{maximumFractionDigits:3})}function aggregate(){let from=localDate(weekStart()),to=localDate(addDays(weekStart(),6)),map=new Map();for(let p of state.plan.filter(p=>p.date>=from&&p.date<=to)){let r=state.recipes.find(r=>r.id===p.recipeId);if(!r)continue;for(let [q,u,name] of r.ingredients){if(state.basics.some(b=>norm(b)===norm(name)))continue;let n=quantity(q)*Number(p.portions||r.portions)*Math.max(1,Number(p.count)||1)/Number(r.portions||1);if(!Number.isFinite(n))continue;let key=norm(name)+'|'+norm(u);let old=map.get(key);if(old)old.qty+=n;else map.set(key,{name,unit:u,qty:n,key})}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'de'))}const SHOP_CATEGORIES=['Obst & Gemüse','Brot & Backwaren','Nudeln, Reis & Getreide','Hülsenfrüchte & Konserven','Milchprodukte & Eier','Fleisch, Fisch & Tofu','Gewürze & Kräuter','Öle, Saucen & Essig','Tiefkühlkost','Getränke','Non-Food','Sonstiges'];
function shoppingCategory(name){let n=norm(name);const patterns=[[/tomat|paprika|gurke|karott|zwiebel|knoblauch|zitrone|ingwer|sprossen|salat|apfel|banane|kartoffel|zucchini|brokkoli|spinat|pilz|obst|gemüse|avocado|limette|frühlingszwiebel/,'Obst & Gemüse'],[/brot|brötchen|mehl|hefe|toast|baguette|fladenbrot/,'Brot & Backwaren'],[/nudel|pasta|spaghetti|reis|couscous|bulgur|quinoa|hafer|grieß/,'Nudeln, Reis & Getreide'],[/linsen|bohnen|kichererbs|mais|tomatenmark|gehackte tomaten|kokosmilch|konserve/,'Hülsenfrüchte & Konserven'],[/feta|joghurt|quark|milch|käse|butter|sahne|ei\b|eier|mozzarella/,'Milchprodukte & Eier'],[/hähnchen|fleisch|fisch|lachs|tofu|tempeh|wurst/,'Fleisch, Fisch & Tofu'],[/petersilie|schnittlauch|koriander|minze|kreuzkümmel|kurkuma|paprikapulver|chili|pfeffer|basilikum|oregano|gewürz/,'Gewürze & Kräuter'],[/öl|essig|senf|sriracha|sojasauce|sauce|brühe/,'Öle, Saucen & Essig'],[/tiefkühl|tk-|gefroren/,'Tiefkühlkost'],[/wasser|saft|limonade|tee|kaffee/,'Getränke'],[/spül|waschmittel|papier|seife|schwamm|müllbeutel|zahnpasta|reiniger/,'Non-Food']];return (patterns.find(([re])=>re.test(n))||[null,'Sonstiges'])[1]}
function shopWeekKey(){return localDate(weekStart())}
function shoppingItems(){let week=shopWeekKey(),map=new Map();for(let i of aggregate())map.set(i.key,{...i});for(let i of (state.manualShopping?.[week]||[])){let key=norm(i.name)+'|'+norm(i.unit);let old=map.get(key);if(old){if(old.qty==null||i.qty==null)old.qty=null;else old.qty+=i.qty;}else map.set(key,{...i,key})}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'de'))}
function addManualShopping(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),qty=Number(f.get('qty')),unit=String(f.get('unit')||'').trim();if(!name||!Number.isFinite(qty)||qty<=0)return alert('Bitte Artikel und gültige Menge eingeben.');let week=shopWeekKey();state.manualShopping ||= {};state.manualShopping[week] ||= [];state.manualShopping[week].push({id:uid(),name,qty,unit});state.shoppingRemoved ||= {};let key=norm(name)+'|'+norm(unit);state.shoppingRemoved[week]=(state.shoppingRemoved[week]||[]).filter(k=>k!==key);save();render()}
function shopping(){let week=shopWeekKey();state.shoppingRemoved ||= {};let removed=state.shoppingRemoved[week]||[];let items=shoppingItems().filter(i=>!removed.includes(i.key));let groups=new Map(SHOP_CATEGORIES.map(c=>[c,[]]));items.forEach(i=>groups.get(shoppingCategory(i.name)).push(i));let checked=items.filter(i=>state.checked.includes(i.key)).length;return `<div class="panel"><h2>Einkaufsliste</h2><p class="muted">Zutaten der angezeigten Woche, nach Warengruppen sortiert und mengenmäßig zusammengefasst. Basics werden ausgeblendet.</p><form class="row" onsubmit="addManualShopping(event)" style="margin:12px 0"><input name="name" required placeholder="Artikel manuell hinzufügen" aria-label="Artikel"><input name="qty" type="number" min="0.001" step="any" value="1" required style="width:90px" aria-label="Menge"><input name="unit" placeholder="Einheit (optional)" style="width:140px" aria-label="Einheit"><button class="primary">+ Hinzufügen</button></form><div class="row"><button class="primary" onclick="addShoppingBasics()">+ Basics</button><button onclick="copyShopping()">Liste kopieren</button><button class="primary" onclick="wbBringOpen()">🛒 Bring! verbinden / testen</button><button onclick="window.print()">Drucken</button><button class="danger" onclick="removeCheckedShopping()" ${checked?'':'disabled'}>Abgehakte löschen (${checked})</button></div>${items.length?[...groups].filter(([c,arr])=>arr.length).map(([c,arr])=>`<section class="shop-group"><h3>${esc(c)}</h3><div class="checks">${arr.map(i=>`<label class="item"><input type="checkbox" ${state.checked.includes(i.key)?'checked':''} onchange="toggleChecked('${encodeURIComponent(i.key)}',this.checked)"><span class="${state.checked.includes(i.key)?'done':''}">${i.qty==null?'':fmt(i.qty)+' '}${esc(i.unit)} ${esc(i.name)}</span></label>`).join('')}</div></section>`).join(''):'<p>Keine offenen Einkäufe für diese Woche.</p>'}${removed.length?`<button onclick="restoreShopping()">Gelöschte Einträge wiederherstellen (${removed.length})</button>`:''}</div>${wbBringPanel()}<div class="panel"><h3>Basics zum Hinzufügen bearbeiten</h3><p class="muted">Ein Artikel pro Zeile. Mit dem Button „+ Basics“ werden diese Artikel ohne Mengenangaben zur aktuellen Einkaufsliste hinzugefügt.</p><textarea id="shoppingBasics">${esc(state.shoppingBasics.join('\n'))}</textarea><button onclick="saveShoppingBasics()">Basics-Liste speichern</button></div><div class="panel"><h3>Basics ausblenden</h3><p class="muted">Kommagetrennte Zutaten, die nicht auf der Einkaufsliste erscheinen sollen.</p><textarea id="basics">${esc(state.basics.join(', '))}</textarea><button onclick="saveBasics()">Basics speichern</button></div>`}
function saveShoppingBasics(){state.shoppingBasics=document.getElementById('shoppingBasics').value.split('\n').map(x=>x.trim()).filter(Boolean);save();render()}function addShoppingBasics(){let week=shopWeekKey();state.manualShopping[week] ||= [];state.shoppingRemoved ||= {};state.shoppingRemoved[week] ||= [];for(let name of state.shoppingBasics){let key=norm(name)+'|';if(!state.manualShopping[week].some(x=>norm(x.name)+'|'+norm(x.unit)===key)){state.manualShopping[week].push({id:uid(),name,qty:null,unit:''});}state.shoppingRemoved[week]=state.shoppingRemoved[week].filter(k=>k!==key)}save();render()}function toggleChecked(key,v){key=decodeURIComponent(key);state.checked=state.checked.filter(k=>k!==key);if(v)state.checked.push(key);save();render()}
function removeCheckedShopping(){let week=shopWeekKey();state.shoppingRemoved ||= {};let keys=shoppingItems().filter(i=>state.checked.includes(i.key)).map(i=>i.key);if(!keys.length)return;state.shoppingRemoved[week]=[...new Set([...(state.shoppingRemoved[week]||[]),...keys])];state.checked=state.checked.filter(k=>!keys.includes(k));state.manualShopping[week]=(state.manualShopping[week]||[]).filter(i=>!keys.includes(norm(i.name)+'|'+norm(i.unit)));save();render()}
function restoreShopping(){state.shoppingRemoved ||= {};delete state.shoppingRemoved[shopWeekKey()];save();render()}
function saveBasics(){state.basics=document.getElementById('basics').value.split(',').map(s=>s.trim()).filter(Boolean);save();render()}function copyShopping(){navigator.clipboard.writeText(shoppingItems().filter(i=>!(state.shoppingRemoved?.[shopWeekKey()]||[]).includes(i.key)).map(i=>`${i.qty==null?'':fmt(i.qty)+' '}${i.unit} ${i.name}`).join('\n')).then(()=>alert('Kopiert')).catch(()=>alert('Kopieren in diesem Browser nicht möglich.'))}
function occurrences(t,start,end){if(!t.date)return[];let d=parseDate(t.date),until=t.until?parseDate(t.until):null,arr=[];if(t.repeat==='none'){if(d>=start&&d<=end)arr.push(localDate(d));return arr}let cur=new Date(d);let iterations=0;while(cur<=end&&iterations++<15000){if(cur>=start&&(!until||cur<=until))arr.push(localDate(cur));if(t.repeat==='daily')cur=addDays(cur,1);else if(t.repeat==='weekly')cur=addDays(cur,7);else if(t.repeat==='monthly'){let original=d.getDate();cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);cur.setDate(Math.min(original,new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate()))}else if(t.repeat==='yearly'){let y=cur.getFullYear()+1,m=d.getMonth(),day=Math.min(d.getDate(),new Date(y,m+1,0).getDate());cur=new Date(y,m,day,12)}else break}return arr}function tasksOn(date){let day=parseDate(date);return state.tasks.filter(t=>occurrences(t,day,day).includes(date))}function occurrenceLabel(t,date){return date&&t.repeat!=='none'&&Object.prototype.hasOwnProperty.call(state.occurrenceLabels||{},t.id+'|'+date)?state.occurrenceLabels[t.id+'|'+date]:t.labelId}function setOccurrenceLabel(id,date,value){let t=state.tasks.find(x=>x.id===id);if(!t)return;state.occurrenceLabels ||= {};if(t.repeat!=='none'&&date){let key=id+'|'+date;if(value===t.labelId)delete state.occurrenceLabels[key];else state.occurrenceLabels[key]=value}else t.labelId=value;save();render()}function labelBadge(id){let l=state.labels.find(x=>x.id===id);return l?`<span class="tag" style="background:${l.color}22;color:${l.color};border:1px solid ${l.color}66">${esc(l.name)}</span>`:''}function labelOptions(selected=''){return `<option value="">Ohne Label</option>`+state.labels.map(l=>`<option value="${esc(l.id)}" ${l.id===selected?'selected':''}>${esc(l.name)}</option>`).join('')}function labelsPanel(){return `<div class="panel"><h3>Labels verwalten</h3><p class="muted">Eigene Labels mit Namen und Farbe anlegen. Ein Label kann mehreren Aufgaben zugeordnet werden.</p><form class="row" onsubmit="addLabel(event)"><input name="name" required maxlength="40" placeholder="Labelname, z. B. Privat"><input name="color" type="color" value="#286d58" aria-label="Labelfarbe"><button>+ Label erstellen</button></form>${state.labels.map(l=>`<div class="label-card">${labelBadge(l.id)}<input aria-label="Label umbenennen" value="${esc(l.name)}" onchange="editLabel('${l.id}','name',this.value)"><input type="color" aria-label="Labelfarbe ändern" value="${l.color}" onchange="editLabel('${l.id}','color',this.value)"><button class="danger" onclick="deleteLabel('${l.id}')">Löschen</button></div>`).join('')}</div>`}function addLabel(e){e.preventDefault();let f=new FormData(e.target);state.labels.push({id:uid(),name:String(f.get('name')).trim(),color:f.get('color')});save();render()}function editLabel(id,key,value){let l=state.labels.find(x=>x.id===id);if(!l)return;if(key==='name'&&!value.trim())return;l[key]=value;save();render()}function deleteLabel(id){if(!confirm('Label löschen? Die Aufgaben bleiben erhalten.'))return;state.labels=state.labels.filter(l=>l.id!==id);state.tasks.forEach(t=>{if(t.labelId===id)t.labelId=''});Object.keys(state.occurrenceLabels||{}).forEach(k=>{if(state.occurrenceLabels[k]===id)state.occurrenceLabels[k]=''});save();render()}function setTaskLabel(id,value){let t=state.tasks.find(x=>x.id===id);if(t){t.labelId=value;save();render()}}function openTaskDialog(date=''){let dialog=document.getElementById('taskDialog');document.getElementById('taskDialogBody').innerHTML=taskForm(date);if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');}function closeTaskDialog(){let d=document.getElementById('taskDialog');if(d.open){if(typeof d.close==='function')d.close();else d.removeAttribute('open');}}function taskForm(selectedDate=''){return `<form onsubmit="addTask(event)" class="row"><input name="name" placeholder="Neue Aufgabe" required><input name="date" type="date" value="${esc(selectedDate)}" aria-label="Termin"><label>Beginn <input name="time" type="time" aria-label="Beginn (optional)"></label><label>Ende <input name="endTime" type="time" aria-label="Ende (optional)"></label><select name="labelId" aria-label="Label">${labelOptions()}</select><select name="repeat"><option value="none">Einmalig</option><option value="daily">Täglich</option><option value="weekly">Wöchentlich</option><option value="monthly">Monatlich</option><option value="yearly">Jährlich</option></select><label>Wiederholung bis <input name="until" type="date"></label><textarea name="notes" placeholder="Notizen (optional)" aria-label="Notizen zum Termin"></textarea><button class="primary">+ Aufgabe</button></form>`}function addTask(e){e.preventDefault();let f=new FormData(e.target),repeat=f.get('date')?f.get('repeat'):'none';if(f.get('endTime')&&!f.get('time'))return alert('Bitte für eine End-Uhrzeit auch eine Start-Uhrzeit angeben.');if(f.get('endTime')&&f.get('endTime')<=f.get('time'))return alert('Die End-Uhrzeit muss nach dem Beginn liegen.');state.tasks.push({id:uid(),name:f.get('name'),date:f.get('date'),time:f.get('date')?(f.get('time')||''):'',endTime:f.get('date')?(f.get('endTime')||''):'',repeat,until:f.get('until'),done:false,doneDates:[],notes:String(f.get('notes')||''),labelId:f.get('labelId')||''});save();closeTaskDialog();render()}function occurrenceNotes(t,date){let key=t.id+'|'+date;return date&&t.repeat!=='none'&&Object.prototype.hasOwnProperty.call(state.occurrenceNotes||{},key)?state.occurrenceNotes[key]:(t.notes||'')}
